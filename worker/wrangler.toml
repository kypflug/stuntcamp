name = "stuntcamp-router"
main = "src/index.js"
compatibility_date = "2025-01-01"
workers_dev = false
# Set explicitly so a zone-scoped API token never has to enumerate memberships.
account_id = "d21847b290ef4e6c41919466ffe2455c"

[vars]
DOMAIN = "stuntcamp.app"
# Azure Static Web App default hostname. The Worker is the only public front
# door; this origin is an implementation detail.
ORIGIN_HOST = "agreeable-dune-07e485f1e.7.azurestaticapps.net"

[[routes]]
pattern = "stuntcamp.app/*"
zone_name = "stuntcamp.app"

[[routes]]
pattern = "*.stuntcamp.app/*"
zone_name = "stuntcamp.app"

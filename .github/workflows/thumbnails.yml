name: thumbnails

on:
  workflow_run:
    workflows: [deploy]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: thumbnails
  cancel-in-progress: true

jobs:
  shots:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Wait for the deploy to propagate
        run: sleep 45

      - name: Capture thumbnails
        run: node scripts/screenshot.mjs

      - name: Open and merge a pull request with any changes
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: bot/thumbnails-${{ github.run_id }}
        run: |
          set -euo pipefail
          git config user.name 'stuntcamp-bot'
          git config user.email 'stuntcamp-bot@users.noreply.github.com'
          git add hub/assets/thumbs
          if git diff --cached --quiet; then
            echo 'no thumbnail changes'
            exit 0
          fi

          # main requires changes to arrive through a pull request, and
          # GITHUB_TOKEN cannot bypass that: Integration bypass actors are only
          # available to organisation-owned repositories, and this one belongs
          # to a user. So the bot raises a pull request and merges it. The
          # ruleset only targets the default branch, so pushing the topic
          # branch is unaffected.
          git switch -c "$BRANCH"
          git commit -m 'chore: refresh thumbnails'
          git push origin "$BRANCH"

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title 'chore: refresh thumbnails' \
            --body 'Automated capture from the post-deploy thumbnail job.'

          # Copilot review is required on the default branch, so the merge can
          # be refused for a few seconds until that review lands.
          merged=''
          for attempt in 1 2 3 4 5; do
            if gh pr merge "$BRANCH" --squash --delete-branch; then
              merged=1
              break
            fi
            echo "merge attempt $attempt was refused; waiting for required reviews to settle"
            sleep 20
          done

          # Nothing is lost if the merge never lands - the captures are sitting
          # in an open pull request - so this warns rather than failing the run.
          if [ -z "$merged" ]; then
            echo "::warning::thumbnail pull request could not be merged automatically; it is open for review"
          fi

          # A merge performed with GITHUB_TOKEN does not trigger workflows, so
          # this ends the chain exactly as the old direct push did: the new
          # thumbnails ship with the next deploy rather than causing one.
          # Dispatching a deploy here instead would loop forever the moment a
          # capture is not byte-identical.

name: thumbnails

on:
  workflow_run:
    workflows: [deploy]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: thumbnails
  cancel-in-progress: true

jobs:
  shots:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Wait for the deploy to propagate
        run: sleep 45

      - name: Capture thumbnails
        run: node scripts/screenshot.mjs

      - name: Commit any changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'stuntcamp-bot'
          git config user.email 'stuntcamp-bot@users.noreply.github.com'
          git add hub/assets/thumbs
          if git diff --cached --quiet; then
            echo 'no thumbnail changes'
            exit 0
          fi
          git commit -m 'chore: refresh thumbnails'
          # main may have moved while the screenshots were being taken.
          for attempt in 1 2 3; do
            if git push; then
              pushed=1
              break
            fi
            git pull --rebase --autostash origin main
          done
          if [ -z "${pushed:-}" ]; then
            echo 'could not push thumbnails after 3 attempts'
            exit 1
          fi
          # Deliberately no deploy dispatch here. Pushes made with GITHUB_TOKEN
          # do not trigger workflows, so this commit ends the chain and the new
          # thumbnails ship with the next deploy. Dispatching one instead would
          # loop forever the moment a capture is not byte-identical.

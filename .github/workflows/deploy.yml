name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Rebuild nightly so apps tracking a branch pick up upstream changes.
    - cron: '17 9 * * *'

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'

      - name: Validate registry
        run: node scripts/validate-registry.mjs

      - name: Build hub index
        run: node hub/build.mjs

      # Not --strict: a single broken app gets a placeholder page rather than
      # blocking everyone else's deploy. The report below flags it.
      - name: Build apps
        run: node scripts/build-apps.mjs

      - name: Build routing table
        run: node scripts/build-routes.mjs

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: dist
          skip_app_build: true

      - name: Deploy Cloudflare Worker
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: '4'
          command: deploy --config worker/wrangler.toml

      - name: Report
        if: always()
        run: |
          {
            echo '### deployed'
            echo
            echo '| app | type | result |'
            echo '| --- | --- | --- |'
            node -e '
              const r = require("./dist/build-report.json");
              for (const a of r) console.log(`| ${a.slug} | ${a.type} | ${a.ok ? `ok (${a.files} files)` : "**failed** — " + a.error.split("\n")[0]} |`);
            '
          } >> "$GITHUB_STEP_SUMMARY"
